server.port=8080

app.session.ttl=PT30M
app.cache.user-profile.ttl=PT5M

app.riak.nodes=${RIAK_NODES:1.riak.dc.lysmux.dev:8087,2.riak.dc.lysmux.dev:8087,3.riak.dc.lysmux.dev:8087}
app.riak.timeout=PT2S

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${POSTGRES_USER:notifications}
spring.datasource.password=${POSTGRES_PASSWORD:notifications}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
