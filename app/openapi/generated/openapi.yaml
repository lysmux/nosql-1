openapi: 3.1.0
info:
  title: Система уведомлений сервиса доставки еды
  version: 1.0.0
  description: |-
    Однопользовательский API: единственный клиент — интерфейс оператора.
    Клиенты сервиса (`User`) в систему не входят и своих операций не имеют.
    Уведомления создаются только системой — при создании заказа и при каждой
    смене его статуса. Отдельной операции отправки уведомления в API нет.
tags:
  - name: Сессия оператора
  - name: Главная страница
  - name: Клиенты
  - name: Заказы
  - name: Уведомления
  - name: Настройки
paths:
  /auth/login:
    post:
      operationId: Auth_login
      description: |-
        Вход оператора. Пароля нет — вход только подтверждает начало работы.
        Создаёт сессию на 30 минут и ставит её токен в httpOnly-cookie `session_token`,
        в теле ответа токена нет. Каждый успешный запрос сдвигает `expiresAt` вперёд.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
      tags:
        - Сессия оператора
      security:
        - {}
  /auth/logout:
    post:
      operationId: Auth_logout
      description: 'Выход оператора: сессия удаляется из хранилища, cookie `session_token` сбрасывается.'
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Сессия оператора
  /main-page/visits:
    post:
      operationId: MainPage_registerVisit
      description: |-
        Регистрирует посещение главной страницы: атомарно увеличивает счётчик
        `main-page` на единицу и возвращает новое значение.
        Списки заказов и лента уведомлений запрашиваются отдельными операциями.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCounter'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Главная страница
  /notifications:
    get:
      operationId: Notifications_feed
      description: |-
        Лента последних уведомлений по всем клиентам для главной страницы,
        отсортированная по `createdAt` по убыванию.
      parameters:
        - name: limit
          in: query
          required: false
          description: Сколько записей вернуть.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Уведомления
  /orders:
    get:
      operationId: Orders_list
      description: БП-2. Страница заказов для главной страницы, от новых к старым.
      parameters:
        - name: page
          in: query
          required: false
          description: Номер страницы, с нуля.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          explode: false
        - name: size
          in: query
          required: false
          description: Размер страницы.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Заказы
    post:
      operationId: Orders_create
      description: |-
        БП-4. Создаёт заказ на существующего клиента в статусе `CREATED`
        и создаёт клиенту уведомление о принятом заказе.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Заказы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
  /orders/{orderId}/advance:
    post:
      operationId: Orders_advance
      description: |-
        БП-5. Продвигает заказ на следующий статус по цепочке
        `CREATED → COOKING → IN_DELIVERY → DELIVERED` и создаёт уведомление клиенту.
        Для заказа в статусе `DELIVERED` возвращает 409.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Заказы
  /settings/cache:
    get:
      operationId: Settings_readCache
      description: Текущее состояние кэша профилей клиентов.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheSettings'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Настройки
    put:
      operationId: Settings_updateCache
      description: |-
        Включает или выключает кэш профилей клиентов без перезапуска.
        Состояние хранится в памяти и после перезапуска возвращается к значению из конфигурации.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheSettings'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Настройки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheSettings'
  /users:
    post:
      operationId: Users_create
      description: БП-3. Создаёт клиента. После создания он доступен для выбора при оформлении заказа.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Клиенты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
    get:
      operationId: Users_search
      description: |-
        Полнотекстовый поиск клиентов по имени: совпадение по началу слов, без учёта регистра.
        Без `query` возвращает первых клиентов по алфавиту.
      parameters:
        - name: query
          in: query
          required: false
          description: Строка поиска.
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          description: Сколько записей вернуть.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 10
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Клиенты
  /users/{userId}:
    get:
      operationId: Users_read
      description: 'БП-6. Профиль клиента. Чтение идёт через кэш: при промахе профиль берётся из основных данных.'
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Клиенты
  /users/{userId}/notifications:
    get:
      operationId: Users_notifications
      description: |-
        БП-7, обязательный сценарий. История уведомлений конкретного клиента,
        отсортированная по `createdAt` по убыванию.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: limit
          in: query
          required: false
          description: Сколько записей вернуть.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ошибка выполнения запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Клиенты
security:
  - ApiKeyAuth: []
components:
  schemas:
    CacheSettings:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Включён ли кэш профилей клиентов.
      description: Настройки кэширования.
    CreateOrderRequest:
      type: object
      required:
        - userId
        - restaurantName
        - totalAmount
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
          description: Идентификатор существующего клиента.
        restaurantName:
          type: string
          minLength: 1
          maxLength: 200
          description: Название ресторана.
        totalAmount:
          type: number
          format: decimal
          minimum: 0
          description: Сумма заказа.
      description: Данные для создания заказа. Клиент должен существовать.
    CreateUserRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Имя клиента.
      description: Данные для создания клиента.
    ErrorCode:
      type: string
      enum:
        - session_expired
        - not_found
        - validation_failed
        - order_completed
      description: Машиночитаемые коды ошибок.
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Код ошибки.
        message:
          type: string
          description: Пояснение для оператора.
      description: Ошибка выполнения запроса.
    Notification:
      type: object
      required:
        - notificationId
        - userId
        - userName
        - orderId
        - text
        - createdAt
      properties:
        notificationId:
          $ref: '#/components/schemas/uuid'
          description: Идентификатор уведомления.
        userId:
          $ref: '#/components/schemas/uuid'
          description: Получатель.
        userName:
          type: string
          description: Имя получателя.
        orderId:
          $ref: '#/components/schemas/uuid'
          description: Заказ, породивший уведомление.
        text:
          type: string
          description: Готовый текст, собранный по текущему статусу заказа.
        createdAt:
          type: string
          format: date-time
          description: Момент создания.
      description: Уведомление клиенту. Создаётся системой при создании заказа и при смене его статуса.
    OperatorSession:
      type: object
      required:
        - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Момент истечения сессии.
      description: Сессия оператора. Живёт 30 минут, продлевается при каждом успешном запросе.
    Order:
      type: object
      required:
        - orderId
        - userId
        - userName
        - restaurantName
        - totalAmount
        - status
        - createdAt
      properties:
        orderId:
          $ref: '#/components/schemas/uuid'
          description: Идентификатор заказа.
        userId:
          $ref: '#/components/schemas/uuid'
          description: Заказчик.
        userName:
          type: string
          description: Имя заказчика.
        restaurantName:
          type: string
          description: Название ресторана. Справочника ресторанов нет, это просто строка.
        totalAmount:
          type: number
          format: decimal
          description: Сумма заказа.
        status:
          $ref: '#/components/schemas/OrderStatus'
          description: Текущий статус.
        createdAt:
          type: string
          format: date-time
          description: Момент создания заказа.
      description: Заказ клиента — источник всех уведомлений.
    OrderPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          description: Заказы страницы, от новых к старым.
        page:
          type: integer
          format: int32
          description: Номер страницы, с нуля.
        pageSize:
          type: integer
          format: int32
          description: Запрошенный размер страницы.
        totalItems:
          type: integer
          format: int64
          description: Всего заказов.
        totalPages:
          type: integer
          format: int32
          description: Всего страниц.
      description: Страница заказов.
    OrderStatus:
      type: string
      enum:
        - CREATED
        - COOKING
        - IN_DELIVERY
        - DELIVERED
      description: Статусы заказа. Переход всегда на один шаг вперёд, `DELIVERED` — конечный.
    PageCounter:
      type: object
      required:
        - pageKey
        - value
      properties:
        pageKey:
          type: string
          description: Фиксированное значение `main-page`.
        value:
          type: integer
          format: int64
          description: Число посещений после инкремента.
      description: Счётчик посещений главной страницы. Счётчик один, только инкремент.
    User:
      type: object
      required:
        - userId
        - name
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
          description: Идентификатор клиента.
        name:
          type: string
          description: Имя клиента.
      description: Клиент сервиса доставки. Учётных данных нет, заводится оператором.
    uuid:
      type: string
      format: uuid
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: session_token
servers:
  - url: http://localhost:8080
    description: Локальный запуск
    variables: {}
