include:
  - component: $CI_SERVER_FQDN/cicd/templates/buildkit@1.0.0
    inputs:
      job_name: build-backend
      stage: build
      registry_repository: $CI_PROJECT_PATH/backend
      build_context: app
      dockerfile_path: app/Dockerfile
      rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH
          changes: &backend-changes
            - app/**/*
            - .gitlab-ci.yml

  - component: $CI_SERVER_FQDN/cicd/templates/buildkit@1.0.0
    inputs:
      job_name: build-frontend
      stage: build
      registry_repository: $CI_PROJECT_PATH/frontend
      build_context: web
      dockerfile_path: web/Dockerfile
      rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH
          changes: &frontend-changes
            - web/**/*
            - .gitlab-ci.yml

  - component: $CI_SERVER_FQDN/cicd/templates/release@1.2.0
    inputs:
      job_name: release-backend
      registry_repository: $CI_PROJECT_PATH/backend
      gitops_path: apps/notification-system
      environment_name: production/backend
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *backend-changes
          when: manual
          allow_failure: true

  - component: $CI_SERVER_FQDN/cicd/templates/release@1.2.0
    inputs:
      job_name: release-frontend
      registry_repository: $CI_PROJECT_PATH/frontend
      gitops_path: apps/notification-system
      environment_name: production/frontend
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *frontend-changes
          when: manual
          allow_failure: true

stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

release-backend:
  needs: [build-backend]

release-frontend:
  needs: [build-frontend]
